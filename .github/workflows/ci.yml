name: CI

on:
  push:
    branches-ignore:
      - main
      - 'template-*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Record start time
        id: start_time
        run: echo "START_TIME=$(date +%s)" >> $GITHUB_ENV

      # Step 1: Checkout code về trước
      - name: Checkout code
        uses: actions/checkout@v2

      # Step 2: Gửi trạng thái Pending
      - name: Send Pending Status to API
        run: |
          branch_name=$(echo ${{ github.ref }} | sed 's|refs/heads/||')
          api_url="https://proxy.kakanie.com/problems/$branch_name/submission/result"
          
          # Tìm file code tự động
          source_file=$(find . -maxdepth 1 -type f \( -name "*.cpp" -o -name "*.java" -o -name "*.py" -o -name "*.c" \) | head -n 1)
          encoded_code=""
          [ -n "$source_file" ] && encoded_code=$(base64 -w 0 "$source_file")
          
          json_payload=$(jq -n \
              --arg branch "$branch_name" \
              --arg actor "${{ github.actor }}" \
              --arg job_name "${{ github.job }}" \
              --arg run_id "${{ github.run_id }}" \
              --arg sha "${{ github.sha }}" \
              --arg status "pending" \
              --arg code "$encoded_code" \
              '{
                problem: $branch,
                actor: $actor,
                job_name: $job_name,
                run_id: $run_id,
                sha: $sha,
                status: $status,
                code: $code
              }')
          
          curl -X POST "$api_url" \
            -H "Content-Type: application/json" \
            -d "$json_payload"

      # Step 3: Cài đặt Môi trường (C++, Java, Python, JQ)
      - name: Set up Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-10 gcc openjdk-17-jdk python3 cmake git curl jq

      # Step 4: Tự động Biên dịch theo Ngôn ngữ
      - name: Compile Code
        id: compile
        run: |
          source_file=$(find . -maxdepth 1 -type f \( -name "*.cpp" -o -name "*.java" -o -name "*.py" -o -name "*.c" \) | head -n 1)
          echo "Found source file: $source_file"
          
          if [ -z "$source_file" ]; then
            echo "Error: No source file found!"
            exit 1
          fi

          ext="${source_file##*.}"
          echo "RUN_MODE=$ext" >> $GITHUB_ENV
          echo "SOURCE_FILE=$source_file" >> $GITHUB_ENV

          if [ "$ext" == "cpp" ]; then
            g++ -o my_program "$source_file" -std=c++17
          elif [ "$ext" == "c" ]; then
            gcc -o my_program "$source_file" -std=c11
          elif [ "$ext" == "java" ]; then
            javac "$source_file"
          elif [ "$ext" == "py" ]; then
            echo "Python script detected. Skipping build step."
          fi

      # Step 5: Xử lý khi lỗi Compile
      - name: Handle Compile Failure
        if: failure()
        run: |
          end_time=$(date +%s)
          start_time=${{ env.START_TIME }}
          duration=$((end_time - start_time))

          branch_name=$(echo ${{ github.ref }} | sed 's|refs/heads/||')
          api_url="https://proxy.kakanie.com/problems/$branch_name/submission/result"
          
          source_file=$(find . -maxdepth 1 -type f \( -name "*.cpp" -o -name "*.java" -o -name "*.py" -o -name "*.c" \) | head -n 1)
          encoded_code=""
          [ -n "$source_file" ] && encoded_code=$(base64 -w 0 "$source_file")

          json_payload=$(jq -n \
            --arg branch "$branch_name" \
            --arg actor "${{ github.actor }}" \
            --arg job_name "${{ github.job }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg sha "${{ github.sha }}" \
            --arg status "compile_error" \
            --arg duration "$duration" \
            --arg code "$encoded_code" \
            '{
              problem: $branch,
              actor: $actor,
              job_name: $job_name,
              run_id: $run_id,
              sha: $sha,
              status: $status,
              duration: ($duration | tonumber),
              code: $code
            }')

          curl -X POST "$api_url" \
            -H "Content-Type: application/json" \
            -d "$json_payload"

      # Step 6: Tải Test Cases
      - name: Fetch Test Cases from API
        if: success()
        run: |
          branch_name=$(echo ${{ github.ref }} | sed 's|refs/heads/||')
          api_url="https://proxy.kakanie.com/problems/$branch_name/testcases"
          curl -s $api_url -o test_cases.json

      # Step 7: Tự động Chạy Tests dựa theo loại ngôn ngữ
      - name: Run Tests
        if: success()
        id: run_tests
        run: |
          pass_count=0
          total_count=0
          results="[]"
          overall_status="passed"

          jq -c '.[]' test_cases.json > test_cases_list.txt
          while IFS= read -r test_case; do
            id=$(echo "$test_case" | jq -r '.id')
            input=$(echo "$test_case" | jq -r '.input')
            expected_output=$(echo "$test_case" | jq -r '.output')

            # Lệnh chạy linh hoạt tùy theo đuôi file
            if [ "$RUN_MODE" == "cpp" ] || [ "$RUN_MODE" == "c" ]; then
              run_cmd="./my_program"
            elif [ "$RUN_MODE" == "java" ]; then
              class_name=$(basename "$SOURCE_FILE" .java)
              run_cmd="java $class_name"
            elif [ "$RUN_MODE" == "py" ]; then
              run_cmd="python3 $SOURCE_FILE"
            fi

            if ! echo "$input" | $run_cmd > output.txt; then
              result_status="error"
              actual_output="N/A"
              overall_status="error"
            else
              sed -i -e '$a\' output.txt
              actual_output=$(cat output.txt)

              if [ "$actual_output" == "$expected_output" ]; then
                result_status="passed"
                pass_count=$((pass_count + 1))
              else
                result_status="failed"
                overall_status="failed"
              fi
            fi

            results=$(echo "$results" | jq --arg id "$id" --arg status "$result_status" --arg actual_output "$actual_output" \
              '. += [{"id": $id, "status": $status, "actual_output": $actual_output}]')

            total_count=$((total_count + 1))
          done < test_cases_list.txt

          encoded_results=$(echo "$results" | jq -c .)
          echo "RESULTS_JSON=$encoded_results" >> $GITHUB_ENV
          echo "OVERALL_STATUS=$overall_status" >> $GITHUB_ENV
          echo "PASS_COUNT=$pass_count" >> $GITHUB_ENV
          echo "TOTAL_COUNT=$total_count" >> $GITHUB_ENV

      # Step 8: Đo thời gian thực thi
      - name: Record end time and calculate duration
        id: end_time
        if: success()
        run: |
          end_time=$(date +%s)
          start_time=${{ env.START_TIME }}
          duration=$((end_time - start_time))
          echo "DURATION=$duration" >> $GITHUB_ENV

      # Step 9: Trả kết quả cuối cùng về API
      - name: Post Test Results
        if: success()
        run: |
          branch_name=$(echo ${{ github.ref }} | sed 's|refs/heads/||')
          api_url="https://proxy.kakanie.com/problems/$branch_name/submission/result"
          
          source_file=$(find . -maxdepth 1 -type f \( -name "*.cpp" -o -name "*.java" -o -name "*.py" -o -name "*.c" \) | head -n 1)
          encoded_code=""
          [ -n "$source_file" ] && encoded_code=$(base64 -w 0 "$source_file")
      
          json_payload=$(jq -n \
              --arg branch "$branch_name" \
              --arg actor "${{ github.actor }}" \
              --arg job_name "${{ github.job }}" \
              --arg run_id "${{ github.run_id }}" \
              --arg sha "${{ github.sha }}" \
              --arg status "$OVERALL_STATUS" \
              --arg result "$RESULTS_JSON" \
              --arg pass_count "$PASS_COUNT" \
              --arg total_count "$TOTAL_COUNT" \
              --arg duration "$DURATION" \
              --arg code "$encoded_code" \
              '{
                problem: $branch,
                actor: $actor,
                job_name: $job_name,
                run_id: $run_id,
                sha: $sha,
                status: $status,
                result: ($result | fromjson),
                pass_count: ($pass_count | tonumber),
                total_count: ($total_count | tonumber),
                duration: ($duration | tonumber),
                code: $code
              }')
          
          curl -X POST "$api_url" \
            -H "Content-Type: application/json" \
            -d "$json_payload"
        env:
          RESULTS_JSON: ${{ env.RESULTS_JSON }}
          OVERALL_STATUS: ${{ env.OVERALL_STATUS }}
          PASS_COUNT: ${{ env.PASS_COUNT }}
          TOTAL_COUNT: ${{ env.TOTAL_COUNT }}
          DURATION: ${{ env.DURATION }}
